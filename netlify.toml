# Netlify build settings. Keeping these in the repo means the dashboard does not
# need configuring by hand, and the settings are reviewable like any other change.

[build]
  # The app lives in client/, so npm install and the build run from there.
  base = "client"
  command = "npm run build"
  # Relative to base — resolves to client/dist.
  publish = "dist"

[build.environment]
  # Vite 8 requires Node ^20.19 or >=22.12. Pinning avoids depending on
  # whatever default Netlify happens to assign the site.
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

# API proxy. The site calls /api/... on its own domain and Netlify forwards it to
# the Express server on Render. To the browser everything is one site, so the
# login cookie is first-party - a cross-site cookie from onrender.com is blocked
# by Safari by default, and by Chrome in incognito. It has to come before the SPA
# fallback below, which would otherwise answer /api/* with index.html.
[[redirects]]
  from = "/api/*"
  to = "https://champion-sets.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
## SPA fallback: React Router owns routing, 
## so any path that is not a real file must return to index.html with a 200 and let client match it
  from = "/*"
  to = "/index.html"
  status = 200